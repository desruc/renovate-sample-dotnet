name: Renovate approve
on:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]
jobs:
  renovate-approve:
    uses: desruc/renovate-presets/.github/workflows/renovate-approve.yml@main
    with:
      # Renovate runs with a personal access token, so PRs are opened as this account.
      renovate-actor: desruc
    permissions:
      contents: read
      pull-requests: write
    secrets:
      RENOVATE_GITHUB_TOKEN: ${{ secrets.RENOVATE_GITHUB_TOKEN }}
